<!DOCTYPE html>
<html>
<body>
<h1 id="name">hanzel</h1>
<script>
let name = document.getElementById("name");
const ws = new WebSocket("ws://localhost:8081");

ws.onopen = () => {
    console.log("Connected!");
    ws.send(`hello , ${name.textContent}`);
};

ws.onmessage = (e) => {
    console.log("Server:", e.data);
};

ws.onclose = () => {
    console.log("Closed");
};

ws.onerror = (e) => {
    console.log("Error", e);
};

</script>
</body>
</html>
