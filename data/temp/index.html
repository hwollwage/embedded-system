<!DOCTYPE html>
<html>
<body>

<h1>JSON Test</h1>

<h2 id="name"></h2>
<p id="email"></p>

<script>
async function loadData() {
    const response = await fetch("/api");
    const data = await response.json();

    document.getElementById("name").textContent =
        data.first_name + " " + data.last_name;

    document.getElementById("email").textContent =
        data.email;
}

loadData();
</script>

</body>
</html>
