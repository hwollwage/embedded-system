<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ESP32 Robot Controller</title>

<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#202124;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;
}

.container{
    display:grid;
    gap:20px;
}

.row{
    display:flex;
    justify-content:center;
    gap:20px;
}

button{
    width:120px;
    height:120px;

    font-size:20px;

    border:none;
    border-radius:20px;

    cursor:pointer;

    background:#444;
    color:white;

    transition:.15s;
}

button:active{
    transform:scale(.95);
    background:#1976d2;
}
</style>

</head>

<body>

<div class="container">

    <div class="row">
        <button id="forward">⬆</button>
    </div>

    <div class="row">
        <button id="left">⬅</button>
        <button id="stop">■</button>
        <button id="right">➡</button>
    </div>

    <div class="row">
        <button id="backward">⬇</button>
    </div>

</div>

<script>

let interval = null;

function startCommand(cmd) {
    fetch("/" + cmd);
    interval = setInterval(() => {
        fetch("/" + cmd);
    }, 100);
}

function stopCommand() {
    clearInterval(interval);
    interval = null;
    fetch("/stop");
}

function bind(id) {
    const btn = document.getElementById(id);
    btn.onpointerdown = () => startCommand(id);
    btn.onpointerup = stopCommand;
    btn.onpointerleave = stopCommand;
    btn.onpointercancel = stopCommand;
}

bind("forward");
bind("backward");
//bind("left");
//bind("right");

document.getElementById("stop").onclick = stopCommand;

</script>
</body>
</html>
